{% extends "base.html" %}

{% block content %}
  {{ super() }}

  <!-- Mermaid Diagram Support -->
  <script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>
  
  <script>
    // Configurar Mermaid
    mermaid.initialize({
      startOnLoad: true,
      theme: 'dark',
      securityLevel: 'loose',
      fontFamily: 'Inter, sans-serif',
      flowchart: {
        useMaxWidth: true,
        htmlLabels: true,
        curve: 'linear'
      },
      sequence: {
        useMaxWidth: true,
        htmlLabels: true
      },
      gantt: {
        useWidth: undefined,
        fontSize: 16,
        fontFamily: 'Inter, sans-serif'
      }
    });

    // Renderizar Mermaid após carregamento da página
    document.addEventListener('DOMContentLoaded', function() {
      mermaid.contentLoaded();

      // Animação suave ao carregar a página
      const content = document.querySelector('.md-content');
      if (content) {
        content.style.animationDelay = '0.1s';
      }

      // Smooth scroll para links internos
      document.querySelectorAll('a[href^="#"]').forEach(anchor => {
        anchor.addEventListener('click', function(e) {
          e.preventDefault();
          const target = document.querySelector(this.getAttribute('href'));
          if (target) {
            target.scrollIntoView({
              behavior: 'smooth',
              block: 'start'
            });
          }
        });
      });

      // Highlight de código com copy button já incluído no Material
      // Adiciona classe para melhor estilo
      document.querySelectorAll('pre > code').forEach(code => {
        code.parentElement.classList.add('highlight-block');
      });

      // Aplicar estilo aos diagramas Mermaid
      document.querySelectorAll('.mermaid').forEach(diagram => {
        diagram.classList.add('mermaid-styled');
        // Envolver em container com melhor apresentação
        const wrapper = document.createElement('div');
        wrapper.className = 'mermaid-wrapper';
        diagram.parentNode.insertBefore(wrapper, diagram);
        wrapper.appendChild(diagram);
      });
    });

    // Para navegação dinâmica (Instant Loading)
    document.addEventListener('turbo:load', function() {
      mermaid.contentLoaded();
    });
  </script>
{% endblock %}
