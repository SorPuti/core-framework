{% extends "base.html" %}

{% block scripts %}
  {{ super() }}
  <script>
    window.__STRIDE_DOCS__ = {
      repoUrl: {{ config.repo_url | tojson }},
      mdPath: {% if page %}{{ page.file.src_path | replace("\\", "/") | tojson }}{% else %}""{% endif %},
      branch: "main"
    };
  </script>
  <script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>
  <script>
    (function () {
      function githubMarkdownUrl() {
        var c = window.__STRIDE_DOCS__;
        if (!c || !c.repoUrl || !c.mdPath) return "";
        var base = c.repoUrl.replace(/\/$/, "");
        return base + "/blob/" + c.branch + "/docs/" + c.mdPath;
      }

      function escapeHtml(text) {
        var div = document.createElement("div");
        div.textContent = text;
        return div.innerHTML;
      }

      function mermaidTheme() {
        var scheme = document.documentElement.getAttribute("data-md-color-scheme");
        return scheme === "slate" ? "dark" : "default";
      }

      function configureMermaid() {
        if (typeof mermaid === "undefined") return;
        mermaid.initialize({
          startOnLoad: false,
          theme: mermaidTheme(),
          securityLevel: "loose",
          fontFamily: "system-ui, -apple-system, Segoe UI, Roboto, sans-serif",
          logLevel: "error",
          flowchart: {
            useMaxWidth: true,
            htmlLabels: true,
            curve: "basis"
          },
          sequence: {
            useMaxWidth: true,
            htmlLabels: true
          }
        });
      }

      function ensureSourceAttr(el) {
        var t = (el.textContent || "").trim();
        if (t && !el.getAttribute("data-mermaid-src")) {
          el.setAttribute("data-mermaid-src", t);
        }
      }

      /** MkDocs + pymdownx emitem <pre class="mermaid"><code> — precisa virar div.mermaid */
      function normalizeMermaidBlocks() {
        document.querySelectorAll("pre.mermaid").forEach(function (pre) {
          var code = pre.querySelector("code");
          var text = (code ? code.textContent : pre.textContent || "").trim();
          if (!text) return;
          var div = document.createElement("div");
          div.className = "mermaid";
          div.textContent = text;
          div.setAttribute("data-mermaid-src", text);
          pre.replaceWith(div);
        });

        document.querySelectorAll("pre > code.language-mermaid").forEach(function (code) {
          var pre = code.parentElement;
          if (!pre || pre.tagName !== "PRE" || pre.classList.contains("mermaid")) return;
          var text = (code.textContent || "").trim();
          if (!text) return;
          var div = document.createElement("div");
          div.className = "mermaid";
          div.textContent = text;
          div.setAttribute("data-mermaid-src", text);
          pre.replaceWith(div);
        });

        document.querySelectorAll(".mermaid").forEach(ensureSourceAttr);
      }

      function showMermaidFallback(node, err) {
        var src = node.getAttribute("data-mermaid-src") || (node.textContent || "").trim();
        var mdUrl = githubMarkdownUrl();
        var wrap = document.createElement("div");
        wrap.className = "mermaid-error-fallback";
        wrap.setAttribute("role", "alert");
        var msg =
          "<p class=\"mermaid-error-fallback__title\">Não foi possível renderizar este diagrama aqui.</p>" +
          "<p class=\"mermaid-error-fallback__hint\">Abra o arquivo Markdown no repositório para ver o diagrama no contexto original.</p>";
        if (mdUrl) {
          msg +=
            "<p class=\"mermaid-error-fallback__link\"><a href=\"" +
            escapeHtml(mdUrl) +
            "\" target=\"_blank\" rel=\"noopener\">Ver <code>docs/" +
            escapeHtml((window.__STRIDE_DOCS__ && window.__STRIDE_DOCS__.mdPath) || "") +
            "</code> no GitHub</a></p>";
        }
        msg +=
          "<details class=\"mermaid-error-fallback__details\"><summary>Código Mermaid</summary>" +
          "<pre><code>" +
          escapeHtml(src) +
          "</code></pre></details>";
        if (err && err.message) {
          msg +=
            "<p class=\"mermaid-error-fallback__tech\"><small>" +
            escapeHtml(String(err.message)) +
            "</small></p>";
        }
        wrap.innerHTML = msg;
        node.replaceWith(wrap);
      }

      async function renderMermaidDiagrams() {
        if (typeof mermaid === "undefined") return;

        normalizeMermaidBlocks();

        var nodes = [].slice.call(
          document.querySelectorAll(".mermaid:not([data-mermaid-done])")
        );
        if (nodes.length === 0) return;

        configureMermaid();

        for (var i = 0; i < nodes.length; i++) {
          var node = nodes[i];
          try {
            await mermaid.run({ nodes: [node] });
            node.setAttribute("data-mermaid-done", "true");
          } catch (e) {
            showMermaidFallback(node, e);
          }
        }

        document.querySelectorAll(".mermaid[data-mermaid-done]").forEach(function (diagram) {
          if (!diagram.parentElement || !diagram.parentElement.classList.contains("mermaid-wrapper")) {
            var wrapper = document.createElement("div");
            wrapper.className = "mermaid-wrapper";
            diagram.parentElement.insertBefore(wrapper, diagram);
            wrapper.appendChild(diagram);
          }
          var svg = diagram.querySelector("svg");
          if (svg) {
            svg.setAttribute("preserveAspectRatio", "xMidYMid meet");
            svg.style.width = "100%";
            svg.style.height = "auto";
            svg.style.maxWidth = "100%";
          }
        });
      }

      function resetDiagramsForTheme() {
        var list = document.querySelectorAll(".mermaid[data-mermaid-done]");
        list.forEach(function (el) {
          var src = el.getAttribute("data-mermaid-src");
          if (!src) return;
          el.removeAttribute("data-mermaid-done");
          el.innerHTML = "";
          el.textContent = src;
        });
      }

      document.addEventListener("DOMContentLoaded", function () {
        configureMermaid();
        renderMermaidDiagrams().catch(function () {});

        var contentArea = document.querySelector(".md-content");
        var debounceTimer = null;
        function scheduleMermaidRender() {
          if (debounceTimer) clearTimeout(debounceTimer);
          debounceTimer = setTimeout(function () {
            debounceTimer = null;
            renderMermaidDiagrams().catch(function () {});
          }, 120);
        }
        if (contentArea) {
          var obs = new MutationObserver(function () {
            scheduleMermaidRender();
          });
          obs.observe(contentArea, { childList: true, subtree: true });
        }

        var schemeObs = new MutationObserver(function () {
          resetDiagramsForTheme();
          renderMermaidDiagrams().catch(function () {});
        });
        schemeObs.observe(document.documentElement, {
          attributes: true,
          attributeFilter: ["data-md-color-scheme"]
        });
      });

      document.addEventListener("pjax:success", function () {
        setTimeout(function () {
          renderMermaidDiagrams().catch(function () {});
        }, 50);
      });
    })();
  </script>
{% endblock %}
